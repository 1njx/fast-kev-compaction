<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="A conversation before and after Kev compaction: stale tool calls and outputs are removed, everything else is kept word for word">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1b1146"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
<radialGradient id="orb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#c084fc" stop-opacity=".55"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></radialGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c4b5fd"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.t{fill:#fff;font-weight:700}.s{fill:#a5b4fc}.h{fill:#c7d2fe;font-size:13px;letter-spacing:.14em;font-weight:600}
.b{font-size:12px;fill:#0b1020;font-weight:600}.g{fill:none;stroke:#f59e0b;stroke-opacity:.45;stroke-dasharray:5 4}
.gx{fill:#f59e0b;fill-opacity:.55;font-size:11px}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}.orb{animation:pulse 3.2s ease-in-out infinite}
</style>
</defs>
<rect width="1200" height="520" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="518" rx="21" fill="none" stroke="#6366f1" stroke-opacity=".35"/>
<text x="70" y="78" class="t" font-size="44">fast-kev-compaction</text>
<text x="70" y="112" class="s" font-size="19">Drop the stale tool output. Keep everything else word for word.</text>
<text x="70" y="150" class="h">BEFORE</text>
<text x="790" y="150" class="h">AFTER /kevcompact</text>
<rect x="70" y="170" width="300" height="21" rx="6" fill="#60a5fa"/>
<text x="80" y="185" class="b">Fix the failing test in src/b.ts</text>
<rect x="70" y="199" width="230" height="21" rx="6" fill="#a78bfa"/>
<text x="80" y="214" class="b">I'll read the files first.</text>
<rect x="70" y="228" width="230" height="21" rx="6" fill="#fbbf24"/>
<text x="80" y="243" class="b">Read src/unrelated-old.ts</text>
<rect x="70" y="257" width="340" height="21" rx="6" fill="#f59e0b"/>
<text x="80" y="272" class="b">export const a = 1; export const b = 2; ...</text>
<rect x="70" y="286" width="110" height="21" rx="6" fill="#fbbf24"/>
<text x="80" y="301" class="b">Bash: ls</text>
<rect x="70" y="315" width="220" height="21" rx="6" fill="#f59e0b"/>
<text x="80" y="330" class="b">a.ts  b.ts  generated</text>
<rect x="70" y="344" width="150" height="21" rx="6" fill="#fbbf24"/>
<text x="80" y="359" class="b">Bash: npm test</text>
<rect x="70" y="373" width="300" height="21" rx="6" fill="#f59e0b"/>
<text x="80" y="388" class="b">FAIL src/b.ts: expected 2 to be 3</text>
<rect x="70" y="402" width="250" height="21" rx="6" fill="#a78bfa"/>
<text x="80" y="417" class="b">Found it. Fixing b.ts now.</text>
<rect x="70" y="431" width="110" height="21" rx="6" fill="#60a5fa"/>
<text x="80" y="446" class="b">go ahead</text>
<rect x="790" y="170" width="300" height="21" rx="6" fill="#60a5fa"/>
<text x="800" y="185" class="b">Fix the failing test in src/b.ts</text>
<rect x="790" y="199" width="230" height="21" rx="6" fill="#a78bfa"/>
<text x="800" y="214" class="b">I'll read the files first.</text>
<rect x="790" y="228" width="150" height="21" rx="6" fill="#fbbf24"/>
<text x="800" y="243" class="b">Bash: npm test</text>
<rect x="790" y="257" width="300" height="21" rx="6" fill="#f59e0b"/>
<text x="800" y="272" class="b">FAIL src/b.ts: expected 2 to be 3</text>
<rect x="790" y="286" width="250" height="21" rx="6" fill="#a78bfa"/>
<text x="800" y="301" class="b">Found it. Fixing b.ts now.</text>
<rect x="790" y="315" width="110" height="21" rx="6" fill="#60a5fa"/>
<text x="800" y="330" class="b">go ahead</text>
<rect x="790" y="354" width="330" height="21" rx="6" class="g"/>
<text x="802" y="369" class="gx">4 stale tool calls and outputs dropped</text>
<circle class="orb" cx="600" cy="300" r="118" fill="url(#orb)"/>
<rect x="514" y="254" width="172" height="92" rx="18" fill="#1e1b4b" stroke="url(#glow)" stroke-width="2"/>
<text x="600" y="290" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">Kev</text>
<text x="600" y="314" text-anchor="middle" fill="#c7d2fe" font-size="12.5">is this tool call</text>
<text x="600" y="331" text-anchor="middle" fill="#c7d2fe" font-size="12.5">still needed?</text>
<path d="M 430 300 L 508 300" stroke="#c4b5fd" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<path d="M 688 300 L 776 300" stroke="#c4b5fd" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<rect x="70" y="467" width="14" height="14" rx="4" fill="#60a5fa"/>
<text x="92" y="478" fill="#c7d2fe" font-size="14">your messages</text>
<rect x="260" y="467" width="14" height="14" rx="4" fill="#a78bfa"/>
<text x="282" y="478" fill="#c7d2fe" font-size="14">Claude's replies</text>
<rect x="450" y="467" width="14" height="14" rx="4" fill="#fbbf24"/>
<text x="472" y="478" fill="#c7d2fe" font-size="14">tool calls</text>
<rect x="640" y="467" width="14" height="14" rx="4" fill="#f59e0b"/>
<text x="662" y="478" fill="#c7d2fe" font-size="14">tool outputs</text>
<text x="1130" y="478" text-anchor="end" fill="#a5b4fc" font-size="14">Runs on your own Modal GPU. Nothing is rewritten.</text>
</svg>
